version: '3.8'

services:
  service-reviews:
    build: reviews
    container_name: reviews-svc-s22
    expose:
      - "8149"
    command: uvicorn main:app --host 0.0.0.0 --port 8149

  service-other:
    build: other
    container_name: other-svc-s22
    expose:
      - "8149"
    command: uvicorn main:app --host 0.0.0.0 --port 8149

  nginx-gateway:
    image: nginx:alpine
    container_name: api-gateway
    ports:
      - "8080:80"
    volumes:
      - ./infra/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - service-reviews
      - service-other