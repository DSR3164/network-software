apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-app
  labels:
    app: gateway-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway-app
  template:
    metadata:
      labels:
        app: gateway-app
    spec:
      containers:
        - name: tasks-container
          image: gateway-s22:latest
          ports:
            - containerPort: 8236
          env:
            - name: TASKS_SVC_ADDR
              value: "tasks-svc:50051"
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-svc
spec:
  selector:
    app: gateway-app
  type: NodePort
  ports:
    - port: 8236
      targetPort: 8236
      nodePort: 30236
