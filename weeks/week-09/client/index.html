<!doctype html>
<html>
<title>orders-s22</title>
<body>
    <button id="startBtn" disabled onclick="start()">Start (Wait for WS...)</button>

    <script>
        const ws = new WebSocket("ws://localhost:8765");

        // Разрешаем нажатие кнопки только после подключения к серверу
        ws.onopen = () => {
            console.log("WebSocket connected");
            document.getElementById("startBtn").disabled = false;
            document.getElementById("startBtn").innerText = "Start";
        };

        const pc = new RTCPeerConnection({
            iceServers: [{ urls: "stun:stun.l.google.com:19302" }]
        });
        let dc;

        pc.onicecandidate = (e) => {
            if (e.candidate) {
                ws.send(JSON.stringify({ type: "ice", candidate: e.candidate }));
            }
        };

        pc.ondatachannel = (e) => {
            dc = e.channel;
            setupDataChannel(dc);
        };

        function setupDataChannel(channel) {
            channel.onopen = () => {
                console.log("!!! DataChannel open !!!");
                channel.send("Hello from " + (window.name || "someone"));
            };
            channel.onmessage = e => console.log("Received message:", e.data);
        }

        ws.onmessage = async (event) => {
            const data = JSON.parse(event.data);
            console.log("WS received:", data.type);

            try {
                if (data.type === "offer") {
                    await pc.setRemoteDescription(new RTCSessionDescription(data.sdp));
                    const answer = await pc.createAnswer();
                    await pc.setLocalDescription(answer);
                    ws.send(JSON.stringify({ type: "answer", sdp: pc.localDescription }));
                } else if (data.type === "answer") {
                    await pc.setRemoteDescription(new RTCSessionDescription(data.sdp));
                }
                else if (data.type === "ice") {
                    await pc.addIceCandidate(data.candidate);
                }
            } catch (e) {
                console.error("WebRTC Error:", e);
            }
        };

        async function start() {
            console.log("Starting as Caller...");
            dc = pc.createDataChannel("chat");
            setupDataChannel(dc);

            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);

            ws.send(JSON.stringify({ type: "offer", sdp: pc.localDescription }));
        }
    </script>
</body>

</html>
