name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      WEEK: "14"
      GROUP: "331"
      STUDENT_ID: "s22"
      PROJECT_CODE: logs-s22

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run tests
        run: |
          make test WEEK=14

      - name: Build Docker image
        run: |
          docker build -t logs-s22 .

      - name: Save artifact
        uses: actions/upload-artifact@v4
        with:
          name: logs-s22-artifact
          path: .
